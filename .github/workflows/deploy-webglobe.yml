name: Deploy to Webglobe

# Production deploys. main stays the dev branch and publishes to GitHub Pages
# (see deploy-pages.yml); merging main into production ships to odarestaurant.cz.
on:
  push:
    branches: [production]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print what would change without uploading or deleting anything
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: webglobe
  cancel-in-progress: true

env:
  # Webglobe's SFTP (ProFTPD mod_sftp, file transfer only -- no shell).
  SFTP_PORT: 222
  # Pinned so a man-in-the-middle cannot pose as the server. Verified from two
  # independent networks on 2026-10-21. If Webglobe ever rotates the host key
  # the deploy fails loudly rather than trusting the new one; confirm the new
  # fingerprint out of band, then update this line.
  HOST_KEY_FINGERPRINT: SHA256:3gNYupouTRQXL3YjQDBiOC8/fLbwUUbn5pqJVcU4grk

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check project
        run: npm run check

      # Deliberately no BASE_PATH. On Webglobe the site is served from the
      # domain root, unlike the GitHub Pages preview, which lives under
      # /odaRestaurant/ and therefore sets BASE_PATH in deploy-pages.yml.
      - name: Build site
        run: npm run build

      # sshpass is needed because lftp's sftp backend shells out to ssh, and
      # ssh will not read a password from anywhere but a terminal.
      - name: Install lftp and sshpass
        run: sudo apt-get update && sudo apt-get install -y lftp sshpass

      # Fetch the server's host key and refuse to go on unless it matches the
      # pinned fingerprint. This is what lets the ssh calls below run with
      # StrictHostKeyChecking=yes instead of blindly trusting whatever answers.
      - name: Pin the server host key
        env:
          WEBGLOBE_HOST: ${{ secrets.WEBGLOBE_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -p "$SFTP_PORT" -t ed25519 "$WEBGLOBE_HOST" > "$RUNNER_TEMP/hostkey" 2>/dev/null
          FOUND=$(ssh-keygen -lf "$RUNNER_TEMP/hostkey" | awk '{ print $2 }')
          if [ "$FOUND" != "$HOST_KEY_FINGERPRINT" ]; then
            echo "Host key mismatch."
            echo "  expected: $HOST_KEY_FINGERPRINT"
            echo "  got     : $FOUND"
            echo "Refusing to connect. Verify the new key out of band before updating the pin."
            exit 1
          fi
          cat "$RUNNER_TEMP/hostkey" >> ~/.ssh/known_hosts
          echo "Host key matches the pin."

      # Read-only. Prints where the deploy account actually lands and what is
      # already there, in a handful of lines that stay legible even when the
      # mirror step's output runs to hundreds of lines.
      - name: Inspect remote target
        env:
          SSHPASS: ${{ secrets.WEBGLOBE_PASSWORD }}
          LFTP_PASSWORD: ${{ secrets.WEBGLOBE_PASSWORD }}
          WEBGLOBE_HOST: ${{ secrets.WEBGLOBE_HOST }}
          WEBGLOBE_USER: ${{ secrets.WEBGLOBE_USER }}
        run: |
          lftp -e "set sftp:connect-program 'sshpass -e ssh -a -x -o StrictHostKeyChecking=yes -o PubkeyAuthentication=no -o PreferredAuthentications=password'; set cmd:fail-exit yes; set net:max-retries 1; set net:timeout 20; open -u $WEBGLOBE_USER --env-password -p $SFTP_PORT sftp://$WEBGLOBE_HOST; echo '--- pwd ---'; pwd; echo '--- ls . ---'; ls; bye"

      # --delete removes remote files that are no longer in build/, which is
      # what clears out the old site and keeps hashed _app assets from piling
      # up. The deploy account is scoped to public_html, so "." IS the web
      # root and the mirror cannot reach the sibling _sub, backup, logs and
      # tmp directories even if something goes wrong. .well-known is excluded
      # so an ACME challenge can never be deleted out from under a renewal.
      - name: Mirror build/ into public_html/
        env:
          SSHPASS: ${{ secrets.WEBGLOBE_PASSWORD }}
          LFTP_PASSWORD: ${{ secrets.WEBGLOBE_PASSWORD }}
          WEBGLOBE_HOST: ${{ secrets.WEBGLOBE_HOST }}
          WEBGLOBE_USER: ${{ secrets.WEBGLOBE_USER }}
          DRY_RUN: ${{ inputs.dry_run && 'yes' || '' }}
        run: |
          set -euo pipefail
          CONNECT="set sftp:connect-program 'sshpass -e ssh -a -x -o StrictHostKeyChecking=yes -o PubkeyAuthentication=no -o PreferredAuthentications=password'; set cmd:fail-exit yes; set net:max-retries 1; set net:timeout 20; open -u $WEBGLOBE_USER --env-password -p $SFTP_PORT sftp://$WEBGLOBE_HOST;"
          MIRROR="mirror --reverse --delete --exclude '^\.well-known/'"

          if [ -n "$DRY_RUN" ]; then
            # --script writes the plan to a file instead of executing it, so the
            # summary below is guaranteed to be readable however long the plan is.
            PLAN="$RUNNER_TEMP/plan.lftp"
            lftp -e "$CONNECT $MIRROR --script=$PLAN build/ ./; bye"
            echo "::group::Planned operations (by command)"
            awk '{ print $1 }' "$PLAN" | sort | uniq -c | sort -rn
            echo "::endgroup::"
            echo "=== DELETIONS planned on the server ==="
            grep -E '^(rm|rmdir)' "$PLAN" || echo "(none -- the target directory is empty)"
            echo "=== end of deletions ==="
          else
            lftp -e "$CONNECT $MIRROR --verbose=1 build/ ./; bye"
          fi
